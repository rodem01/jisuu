<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>字数カウンター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0f0f11;
    color: #f0f0f0;
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 60px;
  }
  .header { padding: 20px 20px 14px; border-bottom: 1px solid #1e1e24; }
  .header .sub { font-size: 11px; color: #666; letter-spacing: 0.15em; margin-bottom: 4px; }
  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }

  .mode-tabs {
    display: flex; background: #16161c;
    border-radius: 10px; margin: 14px 20px 0; padding: 4px;
  }
  .mode-tab {
    flex: 1; padding: 8px; border-radius: 8px; border: none;
    background: transparent; color: #555; font-size: 13px;
    font-weight: 700; cursor: pointer; font-family: inherit;
    transition: all 0.15s; text-align: center;
  }
  .mode-tab.active { background: #1d9bf0; color: #fff; }

  .tabs { padding: 14px 20px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    padding: 6px 12px; border-radius: 20px; border: 1.5px solid #2a2a33;
    background: transparent; color: #666; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .tab.active-x    { border-color: #1d9bf0; background: #1d9bf022; color: #1d9bf0; }
  .tab.active-ig   { border-color: #e1306c; background: #e1306c22; color: #e1306c; }
  .tab.active-line { border-color: #06c755; background: #06c75522; color: #06c755; }

  .progress-wrap { padding: 16px 20px 0; }
  .bar-bg { height: 4px; background: #1e1e24; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.2s, background 0.3s; background: #1d9bf0; }
  .bar-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; }
  .bar-limit { color: #555; }
  .bar-limit span { color: #888; }
  .bar-remain { color: #666; font-weight: 600; }
  .bar-remain.warn { color: #f59e0b; }
  .bar-remain.over { color: #ef4444; }

  .textarea-wrap { padding: 16px 20px 0; }
  textarea {
    width: 100%; min-height: 180px; background: #16161c;
    border: 1.5px solid #2a2a33; border-radius: 12px; padding: 16px;
    color: #f0f0f0; font-size: 15px; line-height: 1.7; resize: vertical;
    outline: none; font-family: inherit; transition: border-color 0.15s;
  }
  textarea:focus { border-color: #1d9bf0; }

  .stats { padding: 14px 20px 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat { background: #16161c; border-radius: 10px; padding: 12px 14px; border: 1px solid #1e1e24; }
  .stat-label { font-size: 10px; color: #555; margin-bottom: 4px; letter-spacing: 0.05em; }
  .stat-value { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
  .stat-unit { font-size: 11px; color: #666; font-weight: 400; margin-left: 2px; }

  .note { margin: 10px 20px 0; font-size: 11px; color: #555; }

  .actions { padding: 16px 20px 0; display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 13px; border-radius: 10px; border: 1.5px solid #2a2a33;
    background: #16161c; color: #444; font-size: 14px; font-weight: 700;
    cursor: default; font-family: inherit; transition: all 0.15s;
  }
  .btn.active { color: #ccc; cursor: pointer; }
  .btn.copied { border-color: #22c55e44; background: #22c55e22; color: #22c55e; }

  /* ツリーモード */
  .thread-hint {
    margin: 14px 20px 0; padding: 12px 14px; background: #16161c;
    border-radius: 10px; border: 1px solid #1e1e24;
    font-size: 12px; color: #666; line-height: 1.6;
  }
  .thread-hint strong { color: #1d9bf0; }

  .thread-stats-bar { margin: 14px 20px 0; display: flex; gap: 10px; }
  .tstat {
    flex: 1; background: #16161c; border-radius: 10px;
    padding: 12px 14px; border: 1px solid #1e1e24; text-align: center;
  }
  .tstat-label { font-size: 10px; color: #555; margin-bottom: 4px; }
  .tstat-value { font-size: 20px; font-weight: 800; }
  .tstat-unit { font-size: 11px; color: #666; margin-left: 2px; }

  .split-btn-wrap { padding: 12px 20px 0; }
  .split-btn {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: #1d9bf0; color: #fff; font-size: 15px; font-weight: 800;
    cursor: pointer; font-family: inherit; transition: opacity 0.15s;
  }
  .split-btn:disabled { opacity: 0.3; cursor: default; }

  .thread-result { padding: 16px 20px 0; }
  .thread-result-title { font-size: 11px; color: #555; letter-spacing: 0.1em; margin-bottom: 12px; }

  .post-card {
    background: #16161c; border: 1.5px solid #1e1e24;
    border-radius: 12px; margin-bottom: 12px;
    overflow: hidden; position: relative; transition: border-color 0.2s;
  }
  .post-card.over { border-color: #ef444455; }
  .post-card:not(:last-child)::after {
    content: ''; position: absolute; left: 28px; bottom: -12px;
    width: 2px; height: 12px; background: #2a2a33;
  }
  .post-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px 8px; border-bottom: 1px solid #1e1e24;
  }
  .post-num { font-size: 11px; font-weight: 800; color: #1d9bf0; }

  .post-bar-wrap { flex: 1; margin: 0 10px; }
  .post-bar-bg { height: 3px; background: #2a2a33; border-radius: 3px; overflow: hidden; }
  .post-bar-fill { height: 100%; border-radius: 3px; transition: width 0.2s, background 0.2s; }

  .post-meta { display: flex; align-items: center; gap: 8px; }
  .post-chars { font-size: 12px; font-weight: 700; color: #555; min-width: 54px; text-align: right; }
  .post-chars.warn { color: #f59e0b; }
  .post-chars.over { color: #ef4444; }
  .post-copy {
    padding: 4px 10px; border-radius: 6px; border: 1px solid #2a2a33;
    background: transparent; color: #888; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .post-copy.done { border-color: #22c55e44; color: #22c55e; }

  .post-edit {
    width: 100%; background: transparent; border: none;
    padding: 10px 14px 14px; color: #ddd; font-size: 14px;
    line-height: 1.7; resize: none; outline: none; font-family: inherit;
    overflow: hidden; min-height: 60px;
  }
  .post-edit.over { color: #f87171; }

  .copy-all-wrap { padding: 10px 20px 0; }
  .copy-all-btn {
    width: 100%; padding: 13px; border-radius: 10px; border: 1.5px solid #2a2a33;
    background: #16161c; color: #ccc; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .copy-all-btn.done { border-color: #22c55e44; background: #22c55e22; color: #22c55e; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="sub">TOOL</div>
  <h1>字数カウンター</h1>
</div>

<div class="mode-tabs">
  <button class="mode-tab active" id="modeNormal" onclick="switchMode('normal')">通常カウント</button>
  <button class="mode-tab" id="modeThread" onclick="switchMode('thread')">Xツリー分割</button>
</div>

<!-- 通常モード -->
<div id="normalSection">
  <div class="tabs">
    <button class="tab active-x" onclick="setLimit(0,this)">X (1ポスト)</button>
    <button class="tab" onclick="setLimit(1,this)">X (長文)</button>
    <button class="tab" onclick="setLimit(2,this)">Instagram</button>
    <button class="tab" onclick="setLimit(3,this)">LINE</button>
  </div>
  <div class="progress-wrap">
    <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
    <div class="bar-labels">
      <span class="bar-limit">上限: <span id="limitLabel">140</span>字</span>
      <span class="bar-remain" id="remainLabel">残り 140字</span>
    </div>
  </div>
  <div class="textarea-wrap">
    <textarea id="input" placeholder="ここにテキストを入力..." oninput="update()"></textarea>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">換算文字数</div><div class="stat-value"><span id="total">0</span><span class="stat-unit">字</span></div></div>
    <div class="stat"><div class="stat-label">実文字数</div><div class="stat-value"><span id="rawcount">0</span><span class="stat-unit">字</span></div></div>
    <div class="stat"><div class="stat-label">行数</div><div class="stat-value"><span id="lines">0</span><span class="stat-unit">行</span></div></div>
  </div>
  <div class="note">※ 半角英数・記号は0.5字換算（X公式準拠）</div>
  <div class="actions">
    <button class="btn" id="copyBtn" onclick="copyText()">コピー</button>
    <button class="btn" id="clearBtn" onclick="clearText()">クリア</button>
  </div>
</div>

<!-- ツリーモード -->
<div id="threadSection" class="hidden">
  <div class="thread-hint">
    長い文章を貼り付けて <strong>「分割する」</strong> を押すと140字以内に自動分割。分割後は<strong>直接編集でき、リアルタイムで字数チェック</strong>できます。<br>※ 半角は0.5字換算
  </div>
  <div class="textarea-wrap">
    <textarea id="threadInput" placeholder="ここに長文を貼り付け..." oninput="threadUpdate()"></textarea>
  </div>
  <div class="thread-stats-bar">
    <div class="tstat"><div class="tstat-label">換算文字数</div><div class="tstat-value"><span id="tTotal">0</span><span class="tstat-unit">字</span></div></div>
    <div class="tstat"><div class="tstat-label">予想ポスト数</div><div class="tstat-value"><span id="tEstimate">0</span><span class="tstat-unit">件</span></div></div>
  </div>
  <div class="split-btn-wrap">
    <button class="split-btn" id="splitBtn" onclick="splitThread()" disabled>分割する</button>
  </div>
  <div class="thread-result" id="threadResult"></div>
  <div class="copy-all-wrap" id="copyAllWrap" style="display:none">
    <button class="copy-all-btn" id="copyAllBtn" onclick="copyAll()">全ポストをまとめてコピー</button>
  </div>
</div>

<script>
  // ===== 半角0.5換算カウント =====
  function countChars(text) {
    var count = 0;
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      // 半角：ASCII印字可能文字 + 半角カタカナ
      if ((c >= 0x20 && c <= 0x7E) || (c >= 0xFF61 && c <= 0xFF9F)) {
        count += 0.5;
      } else {
        count += 1;
      }
    }
    return count;
  }

  function formatCount(n) {
    // 小数点以下が.5のときはそのまま、整数なら整数表示
    return n % 1 === 0 ? n.toString() : n.toFixed(1);
  }

  // ===== 通常モード =====
  const LIMITS = [
    {value:140,cls:'active-x'},{value:280,cls:'active-x'},
    {value:2200,cls:'active-ig'},{value:10000,cls:'active-line'}
  ];
  const BAR_COLORS = {'active-x':'#1d9bf0','active-ig':'#e1306c','active-line':'#06c755'};
  var currentLimit = LIMITS[0], currentColor = '#1d9bf0';

  function setLimit(i, el) {
    document.querySelectorAll('.tab').forEach(function(t){ t.className='tab'; });
    el.classList.add(LIMITS[i].cls);
    currentLimit = LIMITS[i];
    currentColor = BAR_COLORS[LIMITS[i].cls];
    document.getElementById('limitLabel').textContent = currentLimit.value.toLocaleString();
    update();
  }

  function update() {
    var text = document.getElementById('input').value;
    var weighted = countChars(text);
    var raw = text.length;
    var lines = text === '' ? 0 : text.split('\n').length;

    document.getElementById('total').textContent = formatCount(weighted);
    document.getElementById('rawcount').textContent = raw.toLocaleString();
    document.getElementById('lines').textContent = lines.toLocaleString();

    var lim = currentLimit.value;
    var rem = lim - weighted;
    var pct = Math.min((weighted / lim) * 100, 100);

    var bar = document.getElementById('bar');
    bar.style.width = pct + '%';
    bar.style.background = pct >= 100 ? '#ef4444' : pct >= 80 ? '#f59e0b' : currentColor;

    var el = document.getElementById('remainLabel');
    el.className = 'bar-remain';
    if (rem < 0) {
      el.textContent = formatCount(Math.abs(rem)) + '字オーバー';
      el.classList.add('over');
    } else if (rem <= lim * 0.2) {
      el.textContent = '残り ' + formatCount(rem) + '字';
      el.classList.add('warn');
    } else {
      el.textContent = '残り ' + formatCount(rem) + '字';
    }

    var has = raw > 0;
    document.getElementById('copyBtn').className = 'btn' + (has ? ' active' : '');
    document.getElementById('clearBtn').className = 'btn' + (has ? ' active' : '');
  }

  function copyText() {
    var text = document.getElementById('input').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(function(){
      var b = document.getElementById('copyBtn');
      b.className = 'btn copied'; b.textContent = '✓ コピーした';
      setTimeout(function(){ b.className = 'btn active'; b.textContent = 'コピー'; }, 1500);
    });
  }
  function clearText() {
    if (!document.getElementById('input').value) return;
    document.getElementById('input').value = ''; update();
  }

  function switchMode(mode) {
    var t = mode === 'thread';
    document.getElementById('normalSection').classList.toggle('hidden', t);
    document.getElementById('threadSection').classList.toggle('hidden', !t);
    document.getElementById('modeNormal').classList.toggle('active', !t);
    document.getElementById('modeThread').classList.toggle('active', t);
  }

  // ===== ツリーモード =====
  function threadUpdate() {
    var text = document.getElementById('threadInput').value;
    var weighted = countChars(text);
    document.getElementById('tTotal').textContent = formatCount(weighted);
    document.getElementById('tEstimate').textContent = weighted > 0 ? Math.ceil(weighted / 140) : 0;
    document.getElementById('splitBtn').disabled = text.length === 0;
  }

  function splitIntoChunks(text, limit) {
    var paragraphs = text.split(/\n\n+/);
    var posts = [], current = '';

    for (var pi = 0; pi < paragraphs.length; pi++) {
      var para = paragraphs[pi].trim();
      if (!para) continue;
      var candidate = current ? current + '\n\n' + para : para;
      if (countChars(candidate) <= limit) {
        current = candidate;
      } else {
        if (current) { posts.push(current); current = ''; }
        if (countChars(para) <= limit) {
          current = para;
        } else {
          var parts = para.split(/(?<=。|！|？|!|\?|\n)/);
          for (var si = 0; si < parts.length; si++) {
            var part = parts[si];
            if (!part) continue;
            if (countChars(current + part) <= limit) {
              current += part;
            } else {
              if (current) { posts.push(current); current = ''; }
              // 強制カット（文字単位で計算）
              while (countChars(part) > limit) {
                var chunk = '';
                var chunkCount = 0;
                for (var ci = 0; ci < part.length; ci++) {
                  var cc = part.charCodeAt(ci);
                  var add = ((cc >= 0x20 && cc <= 0x7E) || (cc >= 0xFF61 && cc <= 0xFF9F)) ? 0.5 : 1;
                  if (chunkCount + add > limit) break;
                  chunk += part[ci];
                  chunkCount += add;
                }
                posts.push(chunk);
                part = part.slice(chunk.length);
              }
              current = part;
            }
          }
        }
      }
    }
    if (current.trim()) posts.push(current.trim());
    return posts;
  }

  var splitPosts = [];

  function splitThread() {
    var text = document.getElementById('threadInput').value.trim();
    if (!text) return;
    splitPosts = splitIntoChunks(text, 140);
    renderPosts();
    document.getElementById('copyAllWrap').style.display = 'block';
    document.getElementById('copyAllBtn').className = 'copy-all-btn';
    document.getElementById('copyAllBtn').textContent = '全ポストをまとめてコピー';
    document.getElementById('threadResult').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function renderPosts() {
    var total = splitPosts.length;
    var resultEl = document.getElementById('threadResult');
    resultEl.innerHTML = '<div class="thread-result-title">ツリー分割結果 — ' + total + '件のポスト（編集できます）</div>';

    splitPosts.forEach(function(post, i) {
      var card = document.createElement('div');
      card.className = 'post-card';
      card.id = 'card' + i;
      card.innerHTML =
        '<div class="post-header">' +
          '<span class="post-num" id="pnum' + i + '">' + (i+1) + ' / ' + total + '</span>' +
          '<div class="post-bar-wrap"><div class="post-bar-bg"><div class="post-bar-fill" id="pbar' + i + '"></div></div></div>' +
          '<div class="post-meta">' +
            '<span class="post-chars" id="pchars' + i + '"></span>' +
            '<button class="post-copy" id="pcopy' + i + '" onclick="copyPost(' + i + ')">コピー</button>' +
          '</div>' +
        '</div>' +
        '<textarea class="post-edit" id="pedit' + i + '" oninput="onEditPost(' + i + ')">' + escapeHtml(post) + '</textarea>';
      resultEl.appendChild(card);
      setTimeout(function(){ autoResize(document.getElementById('pedit'+i)); updatePostCount(i); }, 0);
    });
  }

  function onEditPost(i) {
    splitPosts[i] = document.getElementById('pedit' + i).value;
    autoResize(document.getElementById('pedit' + i));
    updatePostCount(i);
  }

  function updatePostCount(i) {
    var text = splitPosts[i] || '';
    var weighted = countChars(text);
    var rem = 140 - weighted;
    var pct = Math.min((weighted / 140) * 100, 100);

    var bar = document.getElementById('pbar' + i);
    bar.style.width = pct + '%';
    bar.style.background = pct >= 100 ? '#ef4444' : pct >= 80 ? '#f59e0b' : '#1d9bf0';

    var charsEl = document.getElementById('pchars' + i);
    charsEl.className = 'post-chars' + (weighted > 140 ? ' over' : weighted > 112 ? ' warn' : '');
    charsEl.textContent = weighted > 140
      ? formatCount(weighted - 140) + '字オーバー'
      : '残り ' + formatCount(rem) + '字';

    document.getElementById('card' + i).className = 'post-card' + (weighted > 140 ? ' over' : '');
    document.getElementById('pedit' + i).className = 'post-edit' + (weighted > 140 ? ' over' : '');
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function copyPost(i) {
    navigator.clipboard.writeText(splitPosts[i]).then(function(){
      var b = document.getElementById('pcopy' + i);
      b.className = 'post-copy done'; b.textContent = '✓';
      setTimeout(function(){ b.className = 'post-copy'; b.textContent = 'コピー'; }, 1500);
    });
  }

  function copyAll() {
    var allText = splitPosts.map(function(p, i){
      return '【' + (i+1) + '/' + splitPosts.length + '】\n' + p;
    }).join('\n\n');
    navigator.clipboard.writeText(allText).then(function(){
      var b = document.getElementById('copyAllBtn');
      b.className = 'copy-all-btn done'; b.textContent = '✓ コピーした';
      setTimeout(function(){ b.className = 'copy-all-btn'; b.textContent = '全ポストをまとめてコピー'; }, 1500);
    });
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
